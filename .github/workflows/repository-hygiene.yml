name: Repository hygiene

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-baseline:
    name: Verify public-safe baseline
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enforce public/private runtime boundary
        shell: bash
        run: |
          python3 scripts/check-repository-hygiene.py

      - name: Validate shared architecture contracts
        shell: bash
        run: |
          python3 scripts/validate-contracts.py
